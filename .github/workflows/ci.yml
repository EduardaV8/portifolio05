name: CI - Validação do Portfólio

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar existência do index.html
        run: |
          if [ ! -f index.html ]; then
            echo "❌ index.html não encontrado na raiz!"
            exit 1
          fi

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Instalar dependências do linter
        run: npm install -g htmlhint linkinator

      - name: Executar Linter HTML
        run: htmlhint index.html

      - name: Bloquear arquivos maiores que 500KB
        run: |
          if find . -type f -size +500k | grep .; then
            echo "❌ Arquivo maior que 500KB encontrado!"
            exit 1
          fi

      - name: Verificar termos proibidos
        run: |
          if grep -RniE "TODO|FIXME|senha|password" .; then
            echo "❌ Termos proibidos encontrados!"
            exit 1
          fi

      - name: Validar links e imagens
        run: linkinator index.html
