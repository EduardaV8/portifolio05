name: CI - Validação do Portfólio

on:
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar index.html na raiz
        run: |
          if [ ! -f index.html ]; then
            echo "❌ index.html não encontrado na raiz"
            exit 1
          fi

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Instalar HTMLHint
        run: npm install -g htmlhint

      - name: Executar Linter HTML
        run: htmlhint index.html

      - name: Bloquear arquivos maiores que 500KB
        run: |
          if find . -type f -size +500k | grep .; then
            echo "❌ Arquivo maior que 500KB encontrado"
            exit 1
          fi

      - name: Bloquear palavras proibidas
        run: |
          if grep -R -i -E "TODO|FIXME|senha|password" . \
           --exclude-dir=.git \
           --exclude-dir=.github
          fi

      - name: Verificar links inválidos
        run: |
          grep -R -E "(href|src)=\"\"" index.html && exit 1 || echo "Links OK"
